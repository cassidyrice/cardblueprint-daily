<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Card Blueprint">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Card Blueprint Daily</title>
<style>
  :root {
    --ink: #111111; --soft: #5b5b5b; --line: #e4e4e4; --grid: #f1f1f1;
    --red: #c4122f; --red-deep: #8f0c22; --paper: #ffffff; --wash: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { max-width: 640px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: rgba(255,255,255,.72); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

  header { padding: 12px 16px 0; border-bottom: 1px solid var(--line); background: var(--paper); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 17px; letter-spacing: .01em; white-space: nowrap; }
  .brand b { color: var(--red); font-weight: 400; }
  .date { font-size: 13px; color: var(--soft); white-space: nowrap; }
  .newchat { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }

  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 12px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .tile { flex: 0 0 auto; width: 108px; text-align: left; background: var(--paper); border: 1px solid var(--ink); border-radius: 10px; padding: 7px 9px 8px; position: relative; }
  .tile .seat { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); white-space: nowrap; }
  .tile .code { font-family: Georgia, serif; font-size: 27px; line-height: 1.15; display: flex; align-items: center; gap: 3px; }
  .tile .when { font-size: 11px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.now { border-width: 2px; padding: 6px 8px 7px; }
  .red { color: var(--red); }
  .gem { display: inline-block; font-size: .8em; background: linear-gradient(145deg, #ff5a6e 0%, var(--red) 45%, var(--red-deep) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--red); }
  .gem.blk { background: linear-gradient(145deg, #6a6a6a 0%, #111 50%, #000 100%); -webkit-background-clip: text; background-clip: text; color: #111; }

  main { flex: 1; overflow-y: auto; padding: 16px; scroll-behavior: smooth; }
  .hello { margin: 4px 0 14px; }
  .hello h1 { font-family: Georgia, serif; font-weight: 400; font-size: 23px; line-height: 1.25; margin: 0 0 6px; }
  .hello p { margin: 0; color: var(--soft); font-size: 15px; }
  .ideas { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .idea { text-align: left; background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 8px; padding: 10px 12px; font-size: 15px; }

  .day { text-align: center; font-size: 12px; color: var(--soft); letter-spacing: .06em; text-transform: uppercase; margin: 14px 0 10px; }
  .msg { margin: 0 0 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 10px 13px; border-radius: 14px; overflow-wrap: anywhere; }
  .user .bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
  .bubble h4 { margin: 4px 0 4px; font-size: 15px; }
  .bubble strong { font-weight: 650; }
  .thinking { color: var(--soft); font-style: italic; }
  .err { color: var(--red-deep); font-size: 14px; }
  .retry { margin-top: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 11px; font-size: 13px; }

  #form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--paper); }
  textarea { flex: 1; resize: none; font: inherit; color: inherit; border: 1px solid var(--ink); border-radius: 12px; padding: 10px 12px; max-height: 132px; background: var(--paper); outline-offset: 2px; }
  .send { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--red); color: #fff; font-size: 19px; }
  .send:disabled { background: #cfcfcf; cursor: default; }
  .notice { margin: 0; padding: 10px 16px; font-size: 14px; background: #fff5f6; border-top: 1px solid #f1c9cf; color: var(--red-deep); }
  [hidden] { display: none !important; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
  .sheet { width: 100%; max-width: 640px; max-height: 82%; overflow-y: auto; background: var(--paper); border-radius: 16px 16px 0 0; padding: 18px 18px 22px; border-top: 3px solid var(--red); }
  .sheet .seat { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .sheet h2 { font-family: Georgia, serif; font-weight: 400; font-size: 24px; margin: 2px 0 2px; }
  .sheet .sub { color: var(--soft); font-size: 14px; margin: 0 0 12px; }
  .sheet dl { margin: 0 0 14px; } .sheet dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin-top: 10px; } .sheet dd { margin: 2px 0 0; }
  .sheet .also { font-size: 14px; color: var(--soft); margin: 0 0 14px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--ink); background: var(--paper); }
  .row .go { background: var(--ink); color: #fff; }

  .badge { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
  .alertbar { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #f1c9cf; background: #fff5f6; padding: 9px 16px; font-size: 14px; color: var(--ink); }
  .alertbar b { color: var(--red-deep); font-weight: 650; }
  .alertbar .more { color: var(--soft); }
  .sheet h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); font-weight: 500; margin: 18px 0 6px; }
  .arow { display: block; width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 14.5px; }
  .arow.collide { border-left-color: var(--red); }
  .arow.today { background: #fff5f6; }
  .arow .w { display: block; font-size: 12px; color: var(--soft); }
  .person { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--paper); }
  .person .nm { font-weight: 650; }
  .person .meta { font-size: 13.5px; color: var(--soft); }
  .person .cards { font-family: Georgia, serif; font-size: 18px; margin: 2px 0 4px; }
  .person .links { font-size: 13.5px; margin: 6px 0 0; padding-left: 18px; }
  .person .act { display: flex; gap: 8px; margin-top: 8px; }
  .person .act button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .person .act .go { background: var(--ink); color: #fff; border-color: var(--ink); }
  .addform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .addform label { font-size: 12px; color: var(--soft); display: block; }
  .addform input { width: 100%; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--ink); border-radius: 8px; padding: 8px 10px; margin-top: 2px; }
  .addform .full { grid-column: 1 / -1; }
  .addform button { grid-column: 1 / -1; padding: 11px; border-radius: 10px; border: 0; background: var(--red); color: #fff; }
  .small { font-size: 13px; color: var(--soft); margin: 8px 0 0; }

  .authwrap { max-width: 440px; margin: 0 auto; padding: 44px 22px 32px; }
  .authwrap .brand { font-size: 22px; margin-bottom: 26px; }
  .authwrap h1 { font-family: Georgia, serif; font-weight: 400; font-size: 27px; margin: 0 0 6px; }
  .authwrap .sub { color: var(--soft); margin: 0 0 20px; }
  .authcard { background: var(--paper); border: 1px solid var(--ink); border-radius: 14px; padding: 18px; }
  .authcard .addform { grid-template-columns: 1fr; }
  .linkbtn { border: 0; background: none; padding: 10px 0; color: var(--red-deep); text-decoration: underline; font-size: 15px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack button { padding: 11px; border-radius: 10px; border: 1px solid var(--ink); background: var(--paper); text-align: left; }
  .addform button:disabled, .send:disabled { opacity: .55; }

  /* --- mobile fit ----------------------------------------------------------- */
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; }
  .app { height: 100vh; height: 100dvh; }
  header { padding-top: calc(12px + env(safe-area-inset-top)); padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  #form { padding-bottom: calc(12px + env(safe-area-inset-bottom)); padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); }
  .sheet { padding-bottom: calc(22px + env(safe-area-inset-bottom)); max-height: 86dvh; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .authwrap { padding-top: calc(44px + env(safe-area-inset-top)); padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  main { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .strip { scroll-snap-type: x proximity; scroll-padding-left: 16px; -webkit-overflow-scrolling: touch; }
  .tile { scroll-snap-align: start; }
  /* 44px touch targets; 16px inputs so iOS never zooms on focus */
  .newchat { min-height: 40px; padding: 8px 13px; font-size: 14px; }
  .person .act button, .retry { min-height: 40px; padding: 8px 14px; font-size: 14px; }
  .addform input, textarea, input { font-size: 16px; }
  .addform input { min-height: 46px; }
  .addform button, .row button, .stack button, .btnlink { min-height: 48px; }
  .idea { min-height: 46px; }
  .send { width: 46px; height: 46px; }
  button:active, .btnlink:active { opacity: .7; }
  @media (max-width: 350px) { .brand .d { display: none; } }
  @media (max-width: 380px) { .brand { font-size: 14px; } .newchat { padding: 8px 10px; font-size: 13px; } .tile { width: 100px; } .bubble { max-width: 92%; } }
  @media (min-width: 700px) { .app { border-radius: 0; } }
  @media (prefers-reduced-motion: reduce) { main { scroll-behavior: auto; } }
  .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 22px; background: var(--paper); z-index: 9; }
  .boot b { color: var(--red); font-weight: 400; margin: 0 .3em; }
  /* --- subscription --------------------------------------------------------- */
  .unlock { display: block; width: 100%; text-align: left; margin: 14px 0 0; padding: 13px 14px; border-radius: 10px; border: 0; background: var(--ink); color: #fff; }
  .unlock b { display: block; font-size: 16px; font-weight: 650; } .unlock span { font-size: 13.5px; opacity: .8; }
  .price { border: 1px solid var(--ink); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
  .price b { display: block; font-family: Georgia, serif; font-weight: 400; font-size: 28px; } .price span { color: var(--soft); font-size: 14.5px; }
  .perks { margin: 0 0 14px; padding-left: 20px; font-size: 15px; } .perks li { margin-bottom: 4px; }
  .btnlink { display: flex; align-items: center; justify-content: center; flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); text-decoration: none; text-align: center; }
  .btnlink.go { background: var(--red); border-color: var(--red); color: #fff; font-weight: 650; }
</style>
</head>
<body>
<div class="boot" id="boot">Card <b>Blueprint</b> Daily</div>
<div class="authwrap" id="auth" hidden>
  <div class="brand">Card <b>Blueprint</b> Daily</div>
  <h1 id="authTitle"></h1>
  <p class="sub" id="authSub"></p>
  <div class="authcard">
    <form class="addform" id="authForm">
      <label id="fName">First name<input id="aName" maxlength="40" autocomplete="given-name"></label>
      <label>Email<input id="aEmail" type="email" autocomplete="email" required></label>
      <label>Password<input id="aPass" type="password" minlength="10" required></label>
      <label id="fBirth">Birthday<input id="aBirth" type="date" min="1900-01-01" autocomplete="bday"></label>
      <button type="submit" id="authGo"></button>
    </form>
    <p class="small" id="authMsg" role="status"></p>
  </div>
  <button class="linkbtn" id="authSwap" type="button"></button>
  <p class="small">Card readings describe patterns, not predictions, and are not professional advice. You must be 18 or older.</p>
</div>

<div class="app" id="app" hidden>
  <header>
    <div class="top">
      <div class="brand">Card <b>Blueprint</b><span class="d"> Daily</span></div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="newchat" id="peopleBtn" type="button">People<span class="badge" id="badge" hidden></span></button>
        <button class="newchat" id="accountBtn" type="button">Account</button>
      </div>
    </div>
    <div class="strip" id="strip" aria-label="Your current cards"></div>
  </header>

  <button class="alertbar" id="alertbar" type="button" hidden></button>
  <main id="log" aria-live="polite"></main>

  <p class="notice" id="notice" hidden></p>
  <form id="form">
    <textarea id="input" rows="1" maxlength="2000" enterkeyhint="send" autocapitalize="sentences" placeholder="Ask anything about today…" aria-label="Your question"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">&#8593;</button>
  </form>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<script src="/engine.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
